plugins {
    id 'com.android.application'
}

android {
    namespace = 'diff.strazzere.anti'
    compileSdk = 35
    ndkVersion = '28.0.12433566'

    defaultConfig {
        applicationId = "diff.strazzere.anti"
        minSdk = 21
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"

        // Matches APP_ABI in jni/Application.mk
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // Builds jni/anti.c into libanti.so, loaded by FindEmulator
    externalNativeBuild {
        ndkBuild {
            path = 'jni/Android.mk'
        }
    }

    // This project predates the standard Android layout
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}
